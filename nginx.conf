# OPCIONAL: use se hospedar com Nginx (ex.: Docker).
# index.html nunca fica em cache; src/*.js pode ficar em cache longo,
# porque a URL muda quando você troca o ?v= no index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /src/ {
        add_header Cache-Control "public, max-age=31536000";
    }
}
